[review]
mode = "mdr_only"
max_concurrency = 2
budget_usd = 10.0
max_diff_chars = 12000
completion_tokens = 512
output = "review.md"
state_dir = ".review-state"

[llm]
base_url = "https://oneapi.example/v1"
model = "qwen-plus"
fallback_model = "qwen-turbo"
timeout_seconds = 30
# Optional: store credentials here only in a chmod 600 local copy.
# api_key = "replace-with-your-oneapi-key"

[llm.pricing]
# Unit: USD per 1,000 tokens. v1 uses one blended rate for
# prompt tokens plus completion tokens.
qwen-plus = 0.003
qwen-turbo = 0.001

[github]
token = "replace-with-your-github-token"

[gitlab]
token = "replace-with-your-github-token"

[rules]
enabled_languages = ["go"]
directories = []
disabled_rules = []
